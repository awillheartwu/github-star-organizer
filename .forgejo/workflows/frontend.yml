name: Frontend CI

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.forgejo/workflows/frontend.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'scripts/deploy-compose.sh'
      - 'scripts/ci/**'
      - 'nginx.conf'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - '.forgejo/workflows/frontend.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'scripts/deploy-compose.sh'
      - 'scripts/ci/**'
      - 'nginx.conf'

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, docker]
    container:
      image: node:22-bookworm
    env:
      GSOR_FRONTEND_CONTEXT: .
      NODE_ENV: test
      DOCKER_API_VERSION: '1.43'
      DOCKER_BUILDKIT: '1'
      VITE_API_BASE_URL: ${{ secrets.GSOR_FE_VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure VITE_API_BASE_URL
        shell: bash
        run: |
          if [[ -z "${VITE_API_BASE_URL}" ]]; then
            echo "VITE_API_BASE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Reuse cached Docker CLI and Compose
        run: sh scripts/ci/install-docker.sh

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}" \
            -t gsor-frontend:latest \
            -t gsor-frontend:${{ github.sha }} \
            -f Dockerfile .

      - name: Deploy frontend in shared Compose project
        if: github.event_name == 'push'
        run: bash scripts/deploy-compose.sh web

      - name: Cleanup old images (keep latest 3 builds)
        if: github.event_name == 'push'
        run: |
          docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedAt}}' \
            | awk '$1 ~ /^gsor-frontend:/ && $1 !~ /:latest$/ {print $0}' \
            | sort -rk2 \
            | awk 'NR>3 {print $1}' \
            | xargs -r docker rmi
